
services:
  # ── PostgreSQL 15 + PostGIS 3 ──────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: vietinsect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vietinsect_db
      POSTGRES_USER: vietinsect_user
      POSTGRES_PASSWORD: vietinsect_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietinsect_user -d vietinsect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB 7 (self-hosted) ─────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: vietinsect_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: vietinsect_user
      MONGO_INITDB_ROOT_PASSWORD: vietinsect_pass_2026
      MONGO_INITDB_DATABASE: vietinsect_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ── Redis 7 ────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: vietinsect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── MinIO (S3-compatible) ───────────────────────────
  minio:
    image: minio/minio:latest
    container_name: vietinsect_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vietinsect_minio
      MINIO_ROOT_PASSWORD: vietinsect_minio_2026
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data: